[project]
name = "cosmetic-ad-agent"
version = "0.1.0"
description = "화장품 광고 문구 판정 및 교정 에이전트"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "streamlit>=1.38.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "langchain>=0.2.14",
    "langchain-core>=0.2.35",
    "langchain-community>=0.2.12",
    "langchain-openai>=0.1.22",
    "langchain-qdrant>=0.1.3",
    "langgraph>=0.2.14",
    "qdrant-client>=1.10.0",
    "rank-bm25>=0.2.2",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]
finetune = [
    "torch>=2.4.0",
    "transformers>=4.44.0",
    "peft>=0.12.0",
    "bitsandbytes>=0.43.0",
    "datasets>=2.21.0",
    "accelerate>=0.33.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cosmetic_agent"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
