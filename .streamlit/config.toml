# Beaurette Streamlit 설정 — 종이·숲색 "근거 편집실" 테마
# 색 값은 app/components/styles/base.css 의 :root 토큰과 같다. 한쪽을 바꾸면 다른 쪽도 바꾼다.

[server]
# app/static/ 을 app/static/... 경로로 서빙 (글꼴)
enableStaticServing = true

[client]
# Deploy 등 개발자 메뉴를 숨긴다
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#1F5A47"              # accent (숲색)
backgroundColor = "#F6F3EC"           # bg (종이)
secondaryBackgroundColor = "#FFFDF9"  # 입력칸 바탕
textColor = "#17201B"                 # ink
linkColor = "#1B4D3C"
borderColor = "#E4DED2"
showWidgetBorder = true
baseRadius = "8px"
buttonRadius = "8px"
baseFontSize = 16
font = "'Pretendard Variable', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif"
headingFont = "'Pretendard Variable', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif"
codeFont = "'IBM Plex Mono', 'Pretendard Variable', ui-monospace, monospace"
headingFontWeights = [700, 700, 650, 650, 600, 600]
showSidebarBorder = true

# 상태 색 (st.badge 등). 수정 필요 = 로즈, 실증 필요 = 앰버, 사용 가능 = 세이지, 전문가 검토 = 중성 회색
redColor = "#A8471F"
redBackgroundColor = "#F6E8DF"
redTextColor = "#A8471F"
orangeColor = "#B07A1E"
orangeBackgroundColor = "#F4ECD9"
orangeTextColor = "#865B10"
yellowColor = "#B07A1E"
yellowBackgroundColor = "#F4ECD9"
yellowTextColor = "#865B10"
greenColor = "#1F5A47"
greenBackgroundColor = "#E4ECE5"
greenTextColor = "#1B4D3C"
grayColor = "#7A7F7B"
grayBackgroundColor = "#F0F0ED"
grayTextColor = "#5D615E"
blueColor = "#1F5A47"
blueBackgroundColor = "#E4ECE5"
blueTextColor = "#1B4D3C"
violetColor = "#1F5A47"
violetBackgroundColor = "#E4ECE5"
violetTextColor = "#1B4D3C"
chartCategoricalColors = ["#1F5A47", "#8DB59A", "#C9D9CE"]

# 글꼴은 저장소 안에 둔다 (발표장 인터넷이 불안해도 동작). 라이선스: app/static/fonts/LICENSE-*.txt (OFL-1.1)
[[theme.fontFaces]]
family = "Pretendard Variable"
url = "app/static/fonts/PretendardVariable.woff2"
weight = "45 920"
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/IBMPlexMono-Latin-500.woff2"
weight = "500"
style = "normal"
unicodeRange = "U+0000-00FF, U+2000-206F, U+2212"

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/IBMPlexMono-Latin-600.woff2"
weight = "600"
style = "normal"
unicodeRange = "U+0000-00FF, U+2000-206F, U+2212"

[theme.sidebar]
backgroundColor = "#EFEBE2"             # 종이보다 한 톤 짙게 — 작업 공간과 탐색을 나눈다
secondaryBackgroundColor = "#FFFDF9"
textColor = "#17201B"
primaryColor = "#1F5A47"
borderColor = "#E0D9CC"
